<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grand Theatre | Ticket Booking</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>GRAND THEATRE</h1>
        <p>Choose your seats. Experience the show.</p>
    </header>

    <main>

        <section id="venue">
            <h2>Select Your Seats</h2>

            <div id="venue-map">
                
            </div>
        </section>

        <aside id="booking-panel">

            <h2>Ticket Details</h2>

            <div id="seat-details">
                <p>Select a seat to see its details.</p>
            </div>

            <button id="add-to-cart" disabled>
                ADD TO CART
            </button>

            <h2>Your Cart</h2>

            <div id="cart-items"></div>

            <h3>
                Total:
                <span id="total-price">0 AZN</span>
            </h3>

        </aside>

    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/navigation.js"></script>

</body>
</html>
